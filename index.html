<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyclorithm — плейграунд</title>
<script async src="https://esm.sh/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "codemirror": "https://esm.sh/codemirror@6.0.1",
    "@codemirror/view": "https://esm.sh/@codemirror/view@6.36.5?external=@codemirror/state,@codemirror/language,@lezer/highlight",
    "@codemirror/state": "https://esm.sh/@codemirror/state@6.5.2",
    "@codemirror/language": "https://esm.sh/@codemirror/language@6.11.0?external=@codemirror/state,@codemirror/view,@lezer/highlight",
    "@codemirror/commands": "https://esm.sh/@codemirror/commands@6.8.1?external=@codemirror/state,@codemirror/view,@lezer/highlight",
    "@codemirror/autocomplete": "https://esm.sh/@codemirror/autocomplete@6.16.0?external=@codemirror/state,@codemirror/view,@lezer/highlight",
    "@lezer/highlight": "https://esm.sh/@lezer/highlight@1.2.1"
  }
}
</script>
<style>
  html, body { height: 100%; }
  body { font-family: sans-serif; margin: 0; padding: 4px; display: grid;
         grid-template-rows: minmax(0, 5fr) auto minmax(0, 6fr); gap: 4px; box-sizing: border-box; }
  #timeline { width: 100%; height: 100%; border: 1px solid #ccc; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #error { color: #b00; white-space: pre-wrap; }
  .bottom { display: grid; grid-template-columns: 220px 1fr 1fr; gap: 4px; min-height: 0; }
  #filepanel { border: 1px solid #ccc; overflow: auto; min-height: 0; padding: 4px; font-size: 13px; }
  #filepanel h3 { margin: 2px 0 6px; font-size: 13px; }
  #files { list-style: none; margin: 0 0 6px; padding: 0; }
  #files li { padding: 3px 6px; cursor: pointer; border-radius: 3px; font-family: monospace; word-break: break-all; }
  #files li:hover { background: #eee; }
  #files li.active { background: #cde6ff; font-weight: bold; }
  #filepanel .hint { color: #555; font-size: 11px; margin-top: 6px; }
  #filepanel .row { margin-bottom: 4px; }
  .tablewrap { overflow: auto; min-height: 0; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid #ddd; padding: 4px 8px; text-align: left; }
  #editor { height: 100%; min-height: 0; border: 1px solid #ccc; overflow: hidden; display: flex; flex-direction: column; }
  .cm-editor { flex: 1; min-height: 0; font-size: 13px; }
  .cm-scroller { font-family: monospace; overflow: auto; }
  .cm-gutters { background: #f7f7f7; border-right: 1px solid #ddd; color: #999; }
  .cm-errorLine { background: #ffe0e0; }
</style>
</head>
<body>
<svg id="timeline" role="img" aria-label="таймлайн событий"></svg>
<div class="row">
  <label>start <input id="start" type="datetime-local" value="2026-01-09T00:00"></label>
  <label>end <input id="end" type="datetime-local" value="2026-01-10T00:00"></label>
  <label>запрос <select id="qz" title="Зона окна запроса: Наивно — стены из файла, UTC/±HH:MM — явный пояс"></select></label>
  <label>шкала <select id="tz" title="Зона шкалы: только подписи и ось"></select></label>
  <button id="run">Развернуть</button>
  <button id="zoom-in" title="Приблизить">+</button>
  <button id="zoom-out" title="Отдалить">−</button>
  <button id="zoom-reset" title="Всё окно">⤾</button>
  <span id="error"></span>
</div>
<div class="bottom">
  <div id="filepanel">
    <h3>Файлы</h3>
    <ul id="files"></ul>
    <div class="row">
      <button id="file-new" title="Новый файл">+ Новый</button>
      <button id="file-add" title="Загрузить .cyclo с диска">Загрузить</button>
      <input id="file-input" type="file" accept=".cyclo" multiple hidden>
      <button id="file-del" title="Удалить активный файл">Удалить</button>
    </div>
    <div class="hint">Активный файл — в редакторе, остальные уходят в <code>use</code>. Пути — как в исходнике; переименование — даблкликом. Хранится локально (localStorage).</div>
  </div>
  <div id="editor"></div>
  <div class="tablewrap">
    <table>
      <thead><tr><th>time</th><th>action</th><th>point</th><th>point_attrs</th><th>action_attrs</th></tr></thead>
      <tbody id="events"></tbody>
    </table>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
