<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyclorithm — плейграунд</title>
<style>
  html, body { height: 100%; }
  body { font-family: sans-serif; margin: 0; padding: 4px; display: grid;
         grid-template-rows: minmax(0, 5fr) auto minmax(0, 6fr); gap: 4px; box-sizing: border-box; }
  #timeline { width: 100%; height: 100%; border: 1px solid #ccc; box-sizing: border-box; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #error { color: #b00; white-space: pre-wrap; }
  .bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; min-height: 0; }
  textarea { width: 100%; height: 100%; box-sizing: border-box; font-family: monospace; font-size: 13px; margin: 0; }
  .tablewrap { overflow: auto; min-height: 0; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid #ddd; padding: 4px 8px; text-align: left; }
</style>
</head>
<body>
<svg id="timeline" role="img" aria-label="таймлайн событий"></svg>
<div class="row">
  <label>start <input id="start" type="datetime-local" value="2026-01-09T00:00"></label>
  <label>end <input id="end" type="datetime-local" value="2026-01-10T00:00"></label>
  <button id="run">Развернуть</button>
  <span id="error"></span>
</div>
<div class="bottom">
  <textarea id="src" spellcheck="false"></textarea>
  <div class="tablewrap">
    <table>
      <thead><tr><th>time</th><th>action</th><th>point</th></tr></thead>
      <tbody id="events"></tbody>
    </table>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
