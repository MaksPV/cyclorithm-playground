<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyclorithm — плейграунд</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 16px; max-width: 1100px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  textarea { width: 100%; height: 420px; font-family: monospace; font-size: 13px; }
  .row { margin: 8px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #error { color: #b00; white-space: pre-wrap; min-height: 1.2em; }
  #timeline { width: 100%; height: 90px; border: 1px solid #ccc; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid #ddd; padding: 4px 8px; text-align: left; }
</style>
</head>
<body>
<h1>Cyclorithm — плейграунд (v1: визуализатор)</h1>
<div class="cols">
  <div>
    <textarea id="src" spellcheck="false"></textarea>
    <div class="row">
      <label>start <input id="start" value="2026-01-09T00:00:00" size="21"></label>
      <label>end <input id="end" value="2026-01-10T00:00:00" size="21"></label>
      <button id="run">Развернуть</button>
    </div>
    <div id="error"></div>
  </div>
  <div>
    <svg id="timeline" role="img" aria-label="таймлайн событий"></svg>
    <table>
      <thead><tr><th>time</th><th>action</th><th>point</th></tr></thead>
      <tbody id="events"></tbody>
    </table>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
