[package]
name = "cyclorithm-playground"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[lib]
name = "playground"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
# Точная версия = версии wasm-bindgen-cli (иначе клей рассыплется).
wasm-bindgen = "=0.2.100"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Версия ядра с проверенными исправлениями развёртки и вычислений.
cyclorithm-core = { git = "https://github.com/MaksPV/cyclorithm", rev = "4d700c49a116fc10e7efade6a3a25aeb2a4747dc" }

[dev-dependencies]
wasm-bindgen-test = "0.3"
