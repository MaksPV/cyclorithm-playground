[package]
name = "cyclorithm-playground"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "playground"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
# Точная версия = версии wasm-bindgen-cli (иначе клей рассыплется).
wasm-bindgen = "=0.2.100"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Локальный движок; при публикации репозитория заменить на git-зависимость:
# cyclorithm-core = { git = "https://github.com/MaksPV/cyclorithm", branch = "main" }
cyclorithm-core = { path = "../cycloritm/crates/cyclorithm-core" }

[dev-dependencies]
wasm-bindgen-test = "0.3"
